name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

jobs:
  run_ci_tests:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: block
          policy: global-allowed-endpoints-policy

      - name: Check out repository code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: "20.14.0"

      - name: Setup CI Environment
        run: bash setup.sh

      - name: Run static checks
        run: bash run.sh static_checks

      - name: Run Move tests
        run: bash run.sh test

      - name: Run Move tests on v2
        run: |
          git apply packages/stablecoin/examples/v2_base.patch
          bash run.sh test
          git apply -R packages/stablecoin/examples/v2_base.patch

  scan:
    if: github.event_name == 'pull_request'
    uses: circlefin/circle-public-github-workflows/.github/workflows/pr-scan.yaml@v1
    with:
      allow-reciprocal-licenses: false

  release-sbom:
    if: github.event_name == 'push'
    uses: circlefin/circle-public-github-workflows/.github/workflows/attach-release-assets.yaml@v1
